name: Update ReelMetrics Audience Pulse

on:
  schedule:
    - cron: '30 4,16 * * *' # 10:00 and 22:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audience-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Audience Pulse
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_MOVIE_ID: ${{ vars.TMDB_MOVIE_ID }}
        run: python scripts/pulse.py

      - name: Commit updated Audience Pulse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- reviews.json; then
            echo "No Audience Pulse changes to publish."
          else
            git add reviews.json
            git commit -m "Update Audience Pulse highlights"
            git push origin HEAD:main
          fi
