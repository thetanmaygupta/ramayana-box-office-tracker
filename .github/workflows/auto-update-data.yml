name: Auto-update box office data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update-data.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reelmetrics-data-pipeline
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch box office and TMDB data
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_MOVIE_ID: ${{ vars.TMDB_MOVIE_ID }}
        run: python scripts/update_data.py

      - name: Generate Audience Pulse
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_MOVIE_ID: ${{ vars.TMDB_MOVIE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pulse.py

      - name: Validate generated files
        run: |
          python -m py_compile scripts/update_data.py scripts/pulse.py
          python -m json.tool data.json > /dev/null
          python -m json.tool reviews.json > /dev/null
          echo "Python and JSON validation passed."

      - name: Commit generated data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json reviews.json

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update ReelMetrics box office and audience data"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
