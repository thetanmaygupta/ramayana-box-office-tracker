name: Auto-update box office data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update-data.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: box-office-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest booking and audience data
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python scripts/update_data.py

      - name: Commit and push generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data.json reviews.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update automated box-office and audience data"

            pushed=false

            for attempt in 1 2 3; do
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase failed. Manual conflict resolution required." >&2
                exit 1
              fi

              if git push origin HEAD:main; then
                pushed=true
                echo "Generated data committed successfully."
                break
              fi

              echo "Push attempt $attempt failed."
              sleep 3
            done

            if [ "$pushed" != "true" ]; then
              echo "Unable to push generated data after 3 attempts." >&2
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
