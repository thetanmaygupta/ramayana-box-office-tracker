name: Auto-update box office data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update-data.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: box-office-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, update and push data safely
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=false

          for attempt in 1 2 3; do
            echo "Starting update attempt $attempt..."

            git fetch origin main
            git reset --hard origin/main

            python scripts/update_data.py

            git add -A -- data.json reviews.json

            if git diff --cached --quiet; then
              echo "No generated JSON changes detected."
              pushed=true
              break
            fi

            git commit -m "Update automated box-office and audience data"

            if git push origin HEAD:main; then
              echo "Generated data pushed successfully."
              pushed=true
              break
            fi

            echo "Push race detected. Latest main will be fetched again."
            sleep 5
          done

          if [ "$pushed" != "true" ]; then
            echo "Failed to publish generated data after 3 attempts." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
